# Render with envsubst after loading the external deployment target.

limit_req_zone $binary_remote_addr zone=tenaishi_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ${TENAISHI_API_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${TENAISHI_API_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${TENAISHI_API_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${TENAISHI_API_DOMAIN}/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 100m;
    proxy_read_timeout 180s;

    location ~ /\. {
        deny all;
    }

    location ~ ^/(api/auth/(wechat/(activate|login)|pc-login/(requests|scan|decision|consume))|auth/(login|legacy-login))$ {
        limit_req zone=tenaishi_auth burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
